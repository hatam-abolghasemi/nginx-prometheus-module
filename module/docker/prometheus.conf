# Prometheus metrics for every request this nginx serves (ngx_http_prometheus_module).
# Included in http{} with the rest of conf.d/; nginx.conf loads the module.
#
# Every server is recorded; this one is not. Scrape :9145/metrics.
# Directives: https://github.com/hatam-abolghasemi/nginx-prometheus-module/blob/main/docs/module.md

prometheus_zone 4m;

server {
    listen 9145;

    prometheus_record off;
    access_log off;

    location = /metrics {
        prometheus;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}
