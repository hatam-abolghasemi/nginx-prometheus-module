name: nginx image

# Rebuilds the official nginx image with the module loaded, for one nginx:
# the newest release on Docker Hub, in the main flavors (DEFAULT_FLAVORS: the
# Debian default, Alpine and Alpine slim), on the same platforms, under the
# same tags -- only the image name differs. Each flavor also gets upstream's
# aliases for it, the tags with the same digest on Docker Hub: the Debian
# release for the plain tag (1.31.10-trixie), the Alpine release for the
# Alpine ones (1.31.10-alpine3.24, 1.31.10-alpine3.24-slim).
#
#   nginx:<tag>
#   ghcr.io/<owner>/nginx:<tag>
#
# Each build also pushes the module alone, the two .so files in an empty
# image, to ghcr.io/<owner>/nginx-prometheus-module under the same tags:
#
#   COPY --from=ghcr.io/<owner>/nginx-prometheus-module:<tag> / /usr/lib/nginx/modules/
#
# and attaches the .so files (glibc from Debian, musl from Alpine; amd64 and
# arm64) to the newest GitHub Release, built from that release's tag.
#
# Runs on a push to the module, after a release (release.yml), and when
# watch-upstream.yml sees a new nginx or an upstream image rebuilt under the
# same tag (each image records the upstream digest it was built from,
# org.opencontainers.image.base.digest). `latest` is the newest on Debian,
# as upstream, `alpine` the newest on Alpine; the promote job pushes them last
# (latest last of all), so the package pages show them first. Another version or flavor: dispatch with nginx_version / flavors, or
# one docker build (docs/images.md#any-other-flavor). Failed runs are retried
# by retry.yml.

on:
  push:
    branches: [main]
    paths:
      - nginx/**
      - .github/workflows/nginx-image.yml
  workflow_dispatch:
    inputs:
      nginx_version:
        description: nginx version, e.g. 1.31.10 (empty = the newest)
        required: false
        default: ""
      flavors:
        description: comma-separated flavors, "default" for the plain tag, "all" for every one (empty = default,alpine,alpine-slim)
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: nginx-image
  cancel-in-progress: false

env:
  NGINX_REPO: https://github.com/nginx/nginx.git
  BASE_IMAGE: nginx
  HUB_TAGS: https://hub.docker.com/v2/namespaces/library/repositories/nginx/tags
  # the package pages' descriptions
  # (no commas or equals signs: they go through buildx --annotation)
  IMAGE_DESCRIPTION: "The official nginx image with the Prometheus module loaded - metrics on :9145/metrics. Same tags as nginx: latest is the newest nginx on Debian, alpine and alpine-slim on Alpine."
  MODULE_DESCRIPTION: "The Prometheus module for nginx as files only - ngx_http_prometheus_module.so and ngx_stream_prometheus_module.so for one nginx version and libc. Copy them into your own nginx image."
  # the flavors built when none are asked for; "default" is the plain tag
  DEFAULT_FLAVORS: default,alpine,alpine-slim

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      newest: ${{ steps.version.outputs.newest }}
      matrix: ${{ steps.flavors.outputs.matrix }}
    steps:
      - id: version
        env:
          REQUESTED: ${{ inputs.nginx_version }}
        run: |
          set -euo pipefail
          all=$(git ls-remote --tags --refs "$NGINX_REPO" \
            | awk -F/ '{print $3}' \
            | sed -n 's/^release-\([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p' \
            | sort -V)

          # the newest release Docker Hub has an image for (a new nginx is
          # tagged on GitHub a little before its image is out)
          newest=""
          for v in $(printf '%s\n' "$all" | sort -rV | head -n 5); do
            if curl -fsS -o /dev/null --retry 3 "$HUB_TAGS/$v"; then newest=$v; break; fi
          done
          [ -n "$newest" ] || { echo "::error::no image on Docker Hub for any of the newest nginx releases"; exit 1; }

          version="${REQUESTED:-$newest}"
          printf '%s\n' "$all" | grep -x "$version" > /dev/null \
            || { echo "::error::nginx $version is not a release"; exit 1; }

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "newest=$([ "$version" = "$newest" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "nginx $version (the newest on Docker Hub: $newest)"

      - id: flavors
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NEWEST: ${{ steps.version.outputs.newest }}
          REQUESTED_FLAVORS: ${{ inputs.flavors }}
        run: |
          set -euo pipefail
          wanted="${REQUESTED_FLAVORS// /}"
          wanted=",${wanted:-$DEFAULT_FLAVORS},"
          [ "$wanted" = ",all," ] && wanted=",,"
          series=$(printf '%s' "$VERSION" | cut -d. -f1,2)
          selected=""

          # Every Docker Hub tag "<version>" or "<version>-<flavor>" with its
          # digest and linux platforms. Windows-only tags have no linux platform.
          # All pages first: an alias can be on another page than its flavor.
          rows=""
          url="$HUB_TAGS?page_size=100&name=$VERSION"
          while [ -n "$url" ]; do
            page=$(curl -fsSL --retry 3 "$url")
            rows+=$(jq -c --arg v "$VERSION" '
              .results[]
              | select(.name == $v or (.name | startswith($v + "-")))
              | { flavor: (if .name == $v then "" else (.name | ltrimstr($v + "-")) end),
                  digest: (.digest // ""),
                  platforms: ([.images[]?
                               | select(.os == "linux" and .architecture != "unknown")
                               | "linux/\(.architecture)\(if (.variant // "") != "" then "/" + .variant else "" end)"]
                              | unique | join(",")) }
              | select(.platforms != "")' <<< "$page")$'\n'
            url=$(jq -r '.next // ""' <<< "$page")
          done

          # Tags with the same digest are one image under several names
          # (1.31.10 = 1.31.10-trixie, 1.31.10-alpine = 1.31.10-alpine3.24):
          # the shortest name is the flavor that is built, the others its
          # aliases, pushed as more tags of the same build.
          primary() {
            jq -rs --arg d "$1" --arg f "$2" '
              if $d == "" then $f
              else [.[] | select(.digest == $d) | .flavor]
                   | sort_by([length, .]) | .[0] end' <<< "$rows"
          }

          while IFS= read -r row; do
            [ -n "$row" ] || continue
            flavor=$(jq -r .flavor <<< "$row")
            digest=$(jq -r .digest <<< "$row")
            [ "$(primary "$digest" "$flavor")" = "$flavor" ] || continue
            key=${flavor:-default}
            if [ "$wanted" != ",," ] && [[ "$wanted" != *",$key,"* ]]; then
              continue
            fi
            suffixes=("${flavor:+-$flavor}")
            if [ -n "$digest" ]; then
              while IFS= read -r alias; do
                [ -n "$alias" ] && suffixes+=("-$alias")
              done < <(jq -r --arg d "$digest" --arg f "$flavor" \
                         'select(.digest == $d and .flavor != $f) | .flavor' <<< "$rows" | sort -u)
            fi
            tags=()
            for s in "${suffixes[@]}"; do
              tags+=("$VERSION$s")
              if [ "$NEWEST" = "true" ]; then
                tags+=("$series$s" "mainline$s")
                # latest: the newest nginx, Debian, as upstream; alpine,
                # alpine-slim and every alias (trixie, alpine3.24, ...): the
                # newest in that flavor
                if [ -z "$s" ]; then
                  tags+=("latest")
                elif [[ $s == -alpine* ]] || [ "$s" != "${suffixes[0]}" ]; then
                  tags+=("${s#-}")
                fi
              fi
            done
            echo "build $VERSION${flavor:+-$flavor} as ${tags[*]} ($(jq -r .platforms <<< "$row"))"
            selected+=$(jq -c --arg v "$VERSION" --arg t "$(IFS=,; echo "${tags[*]}")" \
              '. + {version: $v, nginx_tag: ($v + (if .flavor == "" then "" else "-" + .flavor end)), tags: $t}' <<< "$row")$'\n'
          done <<< "$rows"

          [ -n "$selected" ] || { echo "::error::no $BASE_IMAGE:$VERSION image in the flavors $wanted"; exit 1; }
          echo "matrix=$(printf '%s' "$selected" | jq -sc '{include: .}')" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    runs-on: ubuntu-latest
    permissions:
      contents: write         # the .so files on the release
      packages: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    name: build (${{ matrix.nginx_tag }})
    env:
      NGINX_TAG: ${{ matrix.nginx_tag }}
      PLATFORMS: ${{ matrix.platforms }}
      TAGS: ${{ matrix.tags }}
      BASE_DIGEST: ${{ matrix.digest }}
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for smoke test
        id: smoke-build
        run: |
          if [[ ",$PLATFORMS," != *",linux/amd64,"* ]]; then
            echo "::notice::$NGINX_TAG has no linux/amd64 image; smoke test skipped"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docker buildx build \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --build-arg NGINX_TAG="$NGINX_TAG" \
            --platform linux/amd64 \
            -f nginx/docker/Dockerfile \
            -t nginx-prometheus:smoke \
            --load nginx
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        if: steps.smoke-build.outputs.run == 'true'
        run: |
          set -euo pipefail
          docker run -d --name smoke nginx-prometheus:smoke
          probe() { docker run --rm --network container:smoke curlimages/curl -sS --retry 10 --retry-connrefused --retry-delay 1 -m 15 "$@"; }

          # the stock server still answers as before
          probe -o /dev/null http://127.0.0.1/
          probe -o /dev/null http://127.0.0.1/orders/8231 || true
          [ "$(probe http://127.0.0.1:9145/healthz)" = "ok" ]

          metrics=$(probe http://127.0.0.1:9145/metrics)
          echo "$metrics" | grep -E '^nginx_http_requests_total'
          echo "$metrics" | grep 'route="/",status="200"' > /dev/null
          echo "$metrics" | grep 'route="/orders/$param",status="404"' > /dev/null
          echo "$metrics" | grep '^nginx_http_connections{state="active"}' > /dev/null
          echo "$metrics" | grep -x 'nginx_metric_errors_total 0' > /dev/null
          # defaults: histograms off, the metrics server itself not recorded
          if echo "$metrics" | grep '_histogram_bucket' > /dev/null; then
            echo "::error::a histogram is on by default"; exit 1
          fi
          if echo "$metrics" | grep 'route="/metrics"' > /dev/null; then
            echo "::error::the metrics server is recorded"; exit 1
          fi
          # 1 = doesn't parse; 3 = lint findings only (the names are the sidecar's)
          rc=0
          echo "$metrics" | docker run --rm -i --entrypoint promtool prom/prometheus check metrics || rc=$?
          [ "$rc" -eq 0 ] || [ "$rc" -eq 3 ] || { echo "::error::promtool: exit $rc"; exit 1; }

      - name: Smoke test sidecar
        if: steps.smoke-build.outputs.run == 'true'
        run: |
          set -euo pipefail
          docker run -d --name smoke-app busybox \
            sh -c 'mkdir -p /www/orders && echo app-ok > /www/orders/42 && httpd -f -p 8080 -h /www'
          docker run -d --name smoke-sidecar --network container:smoke-app -e APP_PORT=8080 \
            -e STREAM="web:18080:127.0.0.1:8080" nginx-prometheus:smoke
          probe() { docker run --rm --network container:smoke-app curlimages/curl -sS --retry 10 --retry-connrefused --retry-delay 1 -m 15 "$@"; }

          [ "$(probe http://127.0.0.1/orders/42)" = "app-ok" ]
          [ "$(probe http://127.0.0.1:18080/orders/42)" = "app-ok" ]   # through stream
          docker logs smoke-sidecar 2>&1 | grep 'sidecar for 127.0.0.1:8080' > /dev/null

          # outbound: plain HTTP always, CONNECT where the tunnel module is
          [ "$(probe -o /dev/null -w '%{http_code}' -x http://127.0.0.1:3128 http://example.com/)" = "200" ]
          tunnel=false
          if docker logs smoke-sidecar 2>&1 | grep 'outbound on 127.0.0.1:3128' | grep -v 'HTTP only' > /dev/null; then
            tunnel=true
            [ "$(probe -o /dev/null -w '%{http_code}' -x http://127.0.0.1:3128 https://example.com/)" = "200" ]
          fi

          metrics=$(probe http://127.0.0.1:9145/metrics)
          echo "$metrics" | grep 'route="/orders/$param",status="200"' > /dev/null
          echo "$metrics" | grep 'nginx_stream_connections_total{destination="web",upstream_addr="127.0.0.1:8080",status="200"}' > /dev/null
          echo "$metrics" | grep 'method="GET",route="/",status="200",host="example.com",mode="1"' > /dev/null
          if $tunnel; then
            echo "$metrics" | grep 'method="CONNECT",route="example.com:443",status="200",host="example.com",mode="1",protocol="tunnel"' > /dev/null
          fi
          echo "$metrics" | grep -x 'nginx_metric_errors_total 0' > /dev/null

          # https interception, where the tunnel module is: a throwaway CA,
          # example.com decrypted and sent on over verified TLS
          if $tunnel; then
            ca=$(mktemp -d)
            # the curl container doesn't run as root: the directory and the
            # certificate must be readable to it (mktemp -d is 0700)
            chmod 755 "$ca"
            openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 1 \
              -subj /CN=smoke-ca -keyout "$ca/ca.key" -out "$ca/ca.crt" 2> /dev/null
            chmod 644 "$ca/ca.key" "$ca/ca.crt"
            docker run -d --name smoke-app2 busybox sh -c 'httpd -f -p 8080 -h /tmp'
            docker run -d --name smoke-intercept --network container:smoke-app2 -e APP_PORT=8080 \
              -e INTERCEPT_TLS=on -v "$ca:/etc/nginx/intercept:ro" nginx-prometheus:smoke
            probe2() { docker run --rm --network container:smoke-app2 -v "$ca:/ca:ro" curlimages/curl -sS --retry 10 --retry-connrefused --retry-delay 1 -m 15 "$@"; }

            [ "$(probe2 -o /dev/null -w '%{http_code}' -x http://127.0.0.1:3128 --cacert /ca/ca.crt https://example.com/)" = "200" ]
            docker logs smoke-intercept 2>&1 | grep 'with https interception' > /dev/null
            metrics=$(probe2 http://127.0.0.1:9145/metrics)
            echo "$metrics" | grep 'method="GET",route="/",status="200",host="example.com",mode="1",protocol="https"' > /dev/null
            ! echo "$metrics" | grep 'route="example.com:443"' > /dev/null
          fi

      - name: Smoke test logs
        if: always() && steps.smoke-build.outputs.run == 'true'
        run: |
          fatal=0
          for c in smoke smoke-sidecar smoke-intercept; do
            docker logs "$c" > /dev/null 2>&1 || continue
            echo "::group::$c"
            docker logs "$c" 2>&1 | tail -n 100
            echo "::endgroup::"
            if docker logs "$c" 2>&1 | grep -E '\[(emerg|alert|crit)\]'; then
              echo "::error::$c logged fatal errors"; fatal=1
            fi
          done
          exit "$fatal"

      - name: Build and push
        run: |
          set -euo pipefail
          OWNER="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          IMAGE="$OWNER/nginx"
          MODULE="$OWNER/nginx-prometheus-module"

          IFS=, read -ra tags <<< "$TAGS"
          image_tags=(); module_tags=()
          for t in "${tags[@]}"; do
            image_tags+=(-t "$IMAGE:$t")
            module_tags+=(-t "$MODULE:$t")
          done

          meta=(
            --build-arg BASE_IMAGE="$BASE_IMAGE"
            --build-arg NGINX_TAG="$NGINX_TAG"
            --platform "$PLATFORMS"
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY"
            --label org.opencontainers.image.revision="$GIT_SHA"
            --label org.opencontainers.image.version="$NGINX_TAG"
            --label org.opencontainers.image.base.name="docker.io/library/$BASE_IMAGE:$NGINX_TAG"
            --annotation "index,manifest:org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
          )
          # what watch-upstream.yml compares with Docker Hub to see an upstream rebuild
          if [ -n "$BASE_DIGEST" ]; then
            meta+=(--annotation "index,manifest:org.opencontainers.image.base.digest=$BASE_DIGEST")
          fi

          # the module alone first, then the image: the same build stage, cached
          docker buildx build "${meta[@]}" \
            --annotation "index,manifest:org.opencontainers.image.description=$MODULE_DESCRIPTION" \
            -f nginx/docker/Dockerfile --target module \
            "${module_tags[@]}" --push nginx

          docker buildx build "${meta[@]}" \
            --annotation "index,manifest:org.opencontainers.image.description=$IMAGE_DESCRIPTION" \
            -f nginx/docker/Dockerfile \
            "${image_tags[@]}" --push nginx

          {
            echo "### $NGINX_TAG"
            echo "base \`$BASE_IMAGE:$NGINX_TAG\` (\`${BASE_DIGEST:-unknown digest}\`) · \`$PLATFORMS\` · commit \`${GIT_SHA::7}\`"
            echo
            printf -- '- `%s`\n' "${tags[@]/#/$IMAGE:}" "${tags[@]/#/$MODULE:}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach the .so files to the newest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ matrix.version }}
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          # glibc from the Debian default, musl from Alpine; other flavors have
          # none (alpine-slim runs the same nginx as alpine: the same files)
          case $FLAVOR in
            "")     libc=glibc ;;
            alpine) libc=musl ;;
            *)      echo "$NGINX_TAG: no release files for this flavor"; exit 0 ;;
          esac
          tag=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName 2> /dev/null || true)
          if [ -z "$tag" ]; then
            echo "no release yet: nothing to attach"; exit 0
          fi

          # built from the release's own tag, whatever main is now
          git fetch --depth 1 origin "refs/tags/$tag:refs/tags/$tag"
          git worktree add "$RUNNER_TEMP/release" "$tag"
          platforms=""
          for arch in amd64 arm64; do
            # arm64 is listed as linux/arm64/v8
            if [[ ",$PLATFORMS," == *",linux/$arch,"* || ",$PLATFORMS," == *",linux/$arch/"* ]]; then
              platforms+="${platforms:+,}linux/$arch"
            fi
          done
          docker buildx build \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --build-arg NGINX_TAG="$NGINX_TAG" \
            --platform "$platforms" \
            -f "$RUNNER_TEMP/release/nginx/docker/Dockerfile" --target module \
            --output "type=local,dest=$RUNNER_TEMP/so" "$RUNNER_TEMP/release/nginx"

          files=()
          for arch in amd64 arm64; do
            [[ ",$platforms," == *",linux/$arch,"* ]] || continue
            for m in http stream; do
              src="$RUNNER_TEMP/so/linux_$arch/ngx_${m}_prometheus_module.so"
              # a single platform is written to dest itself
              [ -f "$src" ] || src="$RUNNER_TEMP/so/ngx_${m}_prometheus_module.so"
              f="ngx_${m}_prometheus_module-$tag-nginx-$VERSION-linux-$arch-$libc.so"
              cp "$src" "$f"
              sha256sum "$f" > "$f.sha256"
              files+=("$f" "$f.sha256")
            done
          done
          gh release upload "$tag" -R "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          printf -- '- `%s`\n' "${files[@]}" >> "$GITHUB_STEP_SUMMARY"

  # alpine, then latest, pushed last: the package pages show the newest
  # (latest, Debian) first, with its description
  promote:
    needs: [detect, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.detect.outputs.version }}
      NEWEST: ${{ needs.detect.outputs.newest }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set -euo pipefail
          OWNER="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          if [ "$NEWEST" != "true" ]; then
            echo "nginx $VERSION is not the newest: latest stays where it is"; exit 0
          fi
          mainline=$VERSION

          # $1 image, $2 description, $3 the moving tag, $4 the version tag
          promote() {
            if ! docker buildx imagetools inspect "$1:$4" > /dev/null 2>&1; then
              echo "::notice::no $1:$4; $3 not moved"
              return 0
            fi
            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.description=$2" \
              --annotation "index:org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --annotation "index:org.opencontainers.image.version=$4" \
              -t "$1:$3" "$1:$4"
            echo "- \`$1:$3\` = \`$4\`" >> "$GITHUB_STEP_SUMMARY"
          }

          for image in "$OWNER/nginx-prometheus-module|$MODULE_DESCRIPTION" "$OWNER/nginx|$IMAGE_DESCRIPTION"; do
            promote "${image%%|*}" "${image#*|}" alpine "$mainline-alpine"
            promote "${image%%|*}" "${image#*|}" latest "$mainline"
          done
