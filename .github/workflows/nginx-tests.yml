name: nginx tests

# The C module (nginx/): the label and identity code on their own, then the
# module in a real nginx: the newest mainline and stable in a regular build,
# and the newest mainline again under AddressSanitizer and UBSan (memory and
# undefined-behaviour checks; the stable line's own core trips them). nginx/tests/module_test.sh checks the
# exposition with promtool.
on:
  push:
    paths:
      - nginx/**
      - .github/workflows/nginx-tests.yml
  pull_request:
    paths:
      - nginx/**
      - .github/workflows/nginx-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.v.outputs.list }}
      mainline: ${{ steps.v.outputs.mainline }}
    steps:
      - id: v
        run: |
          set -euo pipefail
          all=$(git ls-remote --tags --refs https://github.com/nginx/nginx.git \
            | awk -F/ '{print $3}' \
            | sed -n 's/^release-\([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p' | sort -V)
          mainline=$(printf '%s\n' "$all" | tail -n1)
          stable=$(printf '%s\n' "$all" | awk -F. '$2 % 2 == 0' | tail -n1)
          echo "list=$(jq -nc --arg m "$mainline" --arg s "$stable" '[$m, $s] | unique')" >> "$GITHUB_OUTPUT"
          echo "mainline=$mainline" >> "$GITHUB_OUTPUT"

  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: |
          cd nginx
          cc -Wall -Wextra -Werror -fsanitize=address,undefined -Isrc \
             -o label_test tests/label_test.c src/ngx_http_prometheus_label.c
          ./label_test
          cc -Wall -Wextra -Werror -fsanitize=address,undefined -Isrc \
             -o identity_test tests/identity_test.c src/ngx_http_prometheus_identity.c
          ./identity_test

  nginx:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.list) }}
        sanitize: [false]
        # the sanitizers on the newest mainline only
        include:
          - version: ${{ needs.versions.outputs.mainline }}
            sanitize: true
    name: nginx ${{ matrix.version }}${{ matrix.sanitize && ' (asan)' || '' }}
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get install -y --no-install-recommends libpcre2-dev zlib1g-dev libssl-dev netcat-openbsd python3-grpcio
      - name: promtool
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec docker run --rm -i --entrypoint promtool prom/prometheus "$@"\n' > "$RUNNER_TEMP/bin/promtool"
          chmod +x "$RUNNER_TEMP/bin/promtool"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build nginx and the module
        env:
          VERSION: ${{ matrix.version }}
          SANITIZE: ${{ matrix.sanitize }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nginx"
          curl -fsSL "https://github.com/nginx/nginx/archive/refs/tags/release-$VERSION.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/nginx" --strip-components=1
          cd "$RUNNER_TEMP/nginx"
          opts=()
          if [ "$SANITIZE" = true ]; then
            opts=(--with-cc-opt='-fsanitize=address,undefined -fno-omit-frame-pointer -O1'
                  --with-ld-opt='-fsanitize=address,undefined')
          fi
          ./auto/configure --prefix="$RUNNER_TEMP/out" --with-compat --with-stream \
            --with-http_stub_status_module --with-http_ssl_module --with-http_v2_module \
            --add-dynamic-module="$GITHUB_WORKSPACE/nginx" "${opts[@]}"
          make -j"$(nproc)"
          make install
      - name: Test
        env:
          # an nginx dynamic module trips the ODR check by design (ngx_module_names)
          ASAN_OPTIONS: detect_leaks=0:detect_odr_violation=0:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          for t in module source plug outbound intercept; do
            sh "nginx/tests/${t}_test.sh" "$RUNNER_TEMP/out/sbin/nginx" \
              "$RUNNER_TEMP/out/modules/ngx_http_prometheus_module.so"
          done
          sh nginx/tests/stream_test.sh "$RUNNER_TEMP/out/sbin/nginx" "$RUNNER_TEMP/out/modules"
          # the image's sidecar script, in namespaces of its own: needs root.
          # The runner's sudo ignores -E: the sanitizer settings go by name
          sudo env "PATH=$PATH" "ASAN_OPTIONS=$ASAN_OPTIONS" "UBSAN_OPTIONS=$UBSAN_OPTIONS" \
            sh nginx/tests/sidecar_test.sh "$RUNNER_TEMP/out/sbin/nginx" "$RUNNER_TEMP/out/modules"
