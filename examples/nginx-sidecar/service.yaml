# Clients use port 80, through the sidecar. Prometheus scrapes :9145. The
# ServiceMonitor needs the Prometheus Operator CRDs; its `release` label is a
# placeholder for whatever your Prometheus selects on.
apiVersion: v1
kind: Service
metadata:
  name: example-app
  labels:
    app.kubernetes.io/name: example-app
spec:
  selector:
    app.kubernetes.io/name: example-app
  ports:
  - { name: http,    port: 80,   targetPort: http }
  - { name: metrics, port: 9145, targetPort: metrics }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: example-app
  labels:
    app.kubernetes.io/name: example-app
    release: prometheus-example
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: example-app
  endpoints:
  - port: metrics
    path: /metrics
    interval: 15s
